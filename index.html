if(index===2){road(0,0,12,600);road(0,0,600,12,Math.PI/2);for(let x=-110;x<=110;x+=27)for(let z=-110;z<=110;z+=27){if(Math.abs(x)<12||Math.abs(z)<12)continue;building(x,z,14,14,7+Math.random()*16,Math.random()<.22);if(Math.random()<.3)tree(x+9,z+9,.9);}}

for(let i=0;i<4;i++){let x=35+i*18,z=-40+(i%2)*18;let obj=new THREE.Group();obj.position.set(x,0,z);let body=new THREE.Mesh(new THREE.BoxGeometry(2,1.5,4),mat(0xc75b36));obj.add(body);world.add(obj);targets.push({group:obj,kind:'vehicle',phase:i});}
}
makeScene(settings.scene);
/* === Модель квадрокоптера и вращающиеся винты === */
function makeDrone(){if(droneGroup)scene.remove(droneGroup);droneGroup=new THREE.Group();scene.add(droneGroup);let body=new THREE.Mesh(new THREE.BoxGeometry(.9,.22,.65),mats.white);droneGroup.add(body);let nose=new THREE.Mesh(new THREE.BoxGeometry(.32,.16,.25),mat(0x1b2d37));nose.position.set(0,.02,-.42);droneGroup.add(nose);rotors=[];for(let x of [-.7,.7])for(let z of [-.55,.55]){let arm=new THREE.Mesh(new THREE.BoxGeometry(.9,.07,.07),mats.dark);arm.position.set(x*.5,0,z*.5);droneGroup.add(arm);let rotor=new THREE.Group();rotor.position.set(x,.08,z);let hub=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.07,12),mats.dark);rotor.add(hub);let blade=new THREE.Mesh(new THREE.BoxGeometry(.82,.025,.09),mat(0x26343a));rotor.add(blade);droneGroup.add(rotor);rotors.push(rotor);}let cam=new THREE.Mesh(new THREE.SphereGeometry(.17,12,8),mat(0x182b37));cam.position.set(0,-.08,-.42);droneGroup.add(cam);}

/* === Пространственные датчики, столкновения и маршрутный обход === */

/* === Звук роторов: WebAudio с изменением тона от газа и режима === */
let audioCtx=null,rotorOsc=[],rotorGain=[];function initRotorAudio(){if(audioCtx)return;try{audioCtx=new AudioContext();for(let i=0;i<4;i++){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.value=90;g.gain.value=0;o.connect(g);g.connect(audioCtx.destination);o.start();rotorOsc.push(o);rotorGain.push(g);}}catch{}}

function renderCalibration(){showModal('<h1>Калибровка геймпада</h1><p class="muted">Положите стики в центр на 2 секунды, затем проведите каждый стик до упора во все стороны. Нажмите оба триггера до упора и отпустите.</p><div id="calData" class="glass" style="padding:14px;margin:14px 0">Ожидание данных…</div><div class="row"><button class="primary" id="calFinish">Сохранить калибровку</button><button id="calCancel">Отмена</button></div>');$('calFinish').onclick=()=>{if(calSession){calibration={axes:calSession.min.map((v,i)=>({min:v,max:calSession.max[i],center:calSession.center[i]})),triggers:calSession.triggerMin.map((v,i)=>({min:v,max:calSession.triggerMax[i]}))};localStorage.setItem('djiweb-calibration',JSON.stringify(calibration));calSession=null;toast('Калибровка сохранена');showModal('');}};$('calCancel').onclick=()=>{calSession=null;showModal('');};}
function normalizeAxis(gp,index){let v=gp.axes[index]??0,c=calibration?.axes?.[index];if(c){let range=v>=c.center?c.max-c.center:c.center-c.min;v=range>.05?(v-c.center)/range:0;}return clamp(v,-1,1);}
function normalizeTrigger(gp,index){let v=gp.buttons[index]?.value??0,c=calibration?.triggers?.[index];if(c){let range=c.max-c.min;v=range>.05?(v-c.min)/range:v;}return clamp(v,0,1);}
function curve(v,type){if(type==='expo')return Math.sign(v)*Math.pow(Math.abs(v),1.65);return v;}
function dead(v,d){return Math.abs(v)<d?0:Math.sign(v)*(Math.abs(v)-d)/(1-d);}

window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Escape')showModal('');if(e.code==='KeyV')cycleView();if(e.code==='KeyM')toggleMap();if(e.code==='KeyR')state.recording?stopRecording():startRecording();});

window.addEventListener('gamepadconnected',e=>{pad=e.gamepad;toast('Геймпад подключён: '+pad.id);if(!calibration)beginCalibration();});

function pollPad(dt){let gp=navigator.getGamepads?.().find(g=>g&&g.connected);if(gp)pad=gp;if(!pad)return {yaw:0,throttle:0,pitch:0,roll:0,trigger:0};$('padStatus').textContent=pad.id.slice(0,18);if(calSession){sampleCalibration(pad);let el=$('calData');if(el)el.textContent='Сэмплов: '+calSession.samples+' · оси: '+pad.axes.map(v=>v.toFixed(2)).join(' / ')+' · кнопки: '+pad.buttons.map(b=>b.value.toFixed(2)).join(' / ');return {yaw:0,throttle:0,pitch:0,roll:0,trigger:0};}
let axes=[0,1,2,3].map((_,i)=>curve(dead(normalizeAxis(pad,i),settings.deadStick),settings.curve[i]||'linear'));let btn=i=>pad.buttons[i]?.pressed||false;let rt=normalizeTrigger(pad,7),lt=normalizeTrigger(pad,6);rt=smooth(triggerFiltered[0],curve(dead(rt,settings.deadTrigger),'expo'),settings.triggerSmooth,dt);lt=smooth(triggerFiltered[1],curve(dead(lt,settings.deadTrigger),'expo'),dt);triggerFiltered=[rt,lt];let dpad=(a)=>btn(a);if(dpad(12))gimbalTarget=clamp(gimbalTarget+dt*35,-90,30);if(dpad(13))gimbalTarget=clamp(gimbalTarget-dt*35,-90,30);if(dpad(14))settings.zoom=clamp(settings.zoom-1,1,4);if(dpad(15))settings.zoom=clamp(settings.zoom+1,1,4);
if(btn(5)&&!pressed.rb){setMode(settings.mode+1);pressed.rb=true;}if(!btn(5))pressed.rb=false;if(btn(4)&&!pressed.lb){setMode(settings.mode+2);pressed.lb=true;}if(!btn(4))pressed.lb=false;
if(btn(1)){hold.b+=dt;if(hold.b>.5&&!pressed.b){pressed.b=true;if(!state.flying)takeoff();}}else{if(hold.b>0&&hold.b<=.5&&state.flying)land();hold.b=0;pressed.b=false;}
if(btn(2)){hold.x+=dt;if(hold.x>.5&&!pressed.x){pressed.x=true;if(state.rth)cancelRTH();else startRTH();}}else{hold.x=0;pressed.x=false;}
if(btn(0)){let now=performance.now();if(!pressed.a&&now-lastA<360)emergencyStop();if(!pressed.a)lastA=now;pressed.a=true;}else pressed.a=false;
if(btn(3)&&!pressed.y)photoAction();if(btn(3))pressed.y=true;else pressed.y=false;if(btn(9)&&!pressed.start){showPanel('settings');pressed.start=true;}if(!btn(9))pressed.start=false;if(btn(8)&&!pressed.select){toggleMap();pressed.select=true;}if(!btn(8))pressed.select=false;

return {yaw:axes[0],throttle:-axes[1],roll:axes[2],pitch:-axes[3],trigger:rt-lt};}
let modeHold={next:0,prev:0};function setModeHold(which){if(modeHold[which]===0){setMode(settings.mode+(which==='next'?1:2));modeHold[which]=1;}}
/* === Триггеры RT/LT: отдельная кривая, deadzone и кинематографическое сглаживание === */
function keyboardInput(){return {yaw:(keys[settings.keys.yawR]?1:0)-(keys[settings.keys.yawL]?1:0),throttle:(keys[settings.keys.up]?1:0)-(keys[settings.keys.down]?1:0),pitch:(keys[settings.keys.forward]?1:0)-(keys[settings.keys.back]?1:0),roll:(keys[settings.keys.right]?1:0)-(keys[settings.keys.left]?1:0)};}
function controls(dt){let p=pollPad(dt),k=keyboardInput();let input={yaw:clamp(p.yaw+k.yaw,-1,1),throttle:clamp(p.throttle+k.throttle,-1,1),pitch:clamp(p.pitch+k.pitch,-1,1),roll:clamp(p.roll+k.roll,-1,1)};let trg=p.trigger||0;gimbalTarget=clamp(gimbalTarget+trg*selectedDrone.rotor*settings.gimbalSpeed*35*dt,-90,30);state.gimbal=smooth(state.gimbal,gimbalTarget,settings.gimbalSmooth,dt);return input;}
/* === Полётная физика: фиксированный шаг, инерция, сопротивление и ветер === */
function physics(dt,input){if(!state.flying)return;let mode=settings.mode,limit=selectedDrone.speed[mode],gain=selectedDrone.accel*MODE_MULT[mode]*settings.sensitivity;let freestyle=mode===2&&settings.drone==='avata';state.pitch=smooth(state.pitch,input.pitch,8,dt);state.roll=smooth(state.roll,input.roll,8,dt);let yawRate=(freestyle?2.4:1.25)*input.yaw;state.yaw+=yawRate*dt;
let forward=new THREE.Vector3(-Math.sin(state.yaw),0,-Math.cos(state.yaw)),right=new THREE.Vector3(Math.cos(state.yaw),0,-Math.sin(state.yaw));let desired=forward.multiplyScalar(input.pitch*limit*.72).add(right.multiplyScalar(input.roll*limit*.72));let horizontal=new THREE.Vector3(state.vel.x,0,state.vel.z);let accel=desired.sub(horizontal).multiplyScalar(gain*.8);accel.addScaledVector(wind,selectedDrone.wind*.17);state.vel.x+=accel.x*dt;state.vel.z+=accel.z*dt;let drag=Math.exp(-selectedDrone.drag*(mode===1?.45:1)*dt);state.vel.x*=drag;state.vel.z*=drag;
let verticalTarget=input.throttle*5;state.vel.y+=(verticalTarget-state.vel.y)*(1-Math.exp(-4*dt));if(state.pos.y>=settings.maxAlt&&state.vel.y>0){state.pos.y=settings.maxAlt;state.vel.y=0;if(!state.altWarn){speak('Лимит высоты достигнут');haptic();state.altWarn=true;}}else if(state.pos.y<settings.maxAlt-1)state.altWarn=false;

else{for(let o of obstacles)if(Math.abs(next.x-o.x)<o.hx&&Math.abs(next.z-o.z)<o.hz&&next.y<o.y1&&next.y>o.y0){emergencyStop();toast('Столкновение · аварийная остановка');return;}}

}
function updateRTH(dt){if(!route.length){land();return;}let target=route[0],delta=target.clone().sub(state.pos);if(delta.length()<2){route.shift();if(!route.length){land();return;}target=route[0];delta=target.clone().sub(state.pos);}let desired=delta.normalize().multiplyScalar(Math.min(8,selectedDrone.speed[0]*.65));state.vel.lerp(desired,1-Math.exp(-1.8*dt));}
let quickStart=null;function startQuick(type){if(!state.flying)return;let target=targets[0]?.group.position.clone()||new THREE.Vector3(0,0,0);state.quick={type,t:0,start:state.pos.clone(),target,radius:24,dir:1};speak(type+' запущен');}
function updateQuick(dt){let q=state.quick;q.t+=dt;let t=q.t,ang=t*.42*q.dir,center=q.target;let p=q.start.clone();if(q.type==='Orbit'||q.type==='Circle'||q.type==='POI'){p.set(center.x+Math.cos(ang)*q.radius,q.start.y,center.z+Math.sin(ang)*q.radius);}else if(q.type==='Helix'){p.set(center.x+Math.cos(ang)*q.radius,q.start.y+t*1.6,center.z+Math.sin(ang)*q.radius);}else if(q.type==='Dronie'){p.copy(q.start).add(new THREE.Vector3(0,t*1.0, t*3));}else if(q.type==='Rocket'){p.copy(q.start).add(new THREE.Vector3(0,t*3,0));state.gimbal=lerp(state.gimbal,-85,.04);}else if(q.type==='Boomerang'){let a=ang;p.set(center.x+Math.cos(a)*q.radius*1.5,q.start.y+Math.sin(a*2)*5,center.z+Math.sin(a)*q.radius*.6);}else if(q.type==='Asteroid'){let a=ang;p.set(center.x+Math.cos(a)*q.radius,q.start.y+Math.min(t*2,22),center.z+Math.sin(a)*q.radius);if(t>20)p.lerp(q.start,.03);}else if(q.type==='MasterShots'){p.set(q.start.x+Math.sin(t*.4)*12,q.start.y+Math.sin(t*.7)*4,q.start.z+Math.cos(t*.4)*12);}state.vel.copy(p.sub(state.pos).multiplyScalar(1.6));if(t>28){state.quick=null;state.vel.multiplyScalar(.2);speak('Съёмка завершена');}}
function updateTrack(dt){let tr=state.track;if(!tr)return;let target=tr.target;let dest=state.pos.clone();if(tr.mode==='ActiveTrack')dest.copy(target.position).add(new THREE.Vector3(0,7,15));if(tr.mode==='POI')dest.set(target.position.x+20,state.pos.y,target.position.z);let d=dest.sub(state.pos);if(tr.mode!=='Spotlight')state.vel.lerp(d.multiplyScalar(.45),1-Math.exp(-dt));let look=target.position.clone().sub(state.pos);if(look.lengthSq()>.1){let yaw=Math.atan2(-look.x,-look.z);state.yaw=lerp(state.yaw,yaw,.05);}}
/* === Запись видео с canvas renderer в WebM === */
function startRecording(){try{cameraStream=renderer.domElement.captureStream(30);recorder=new MediaRecorder(cameraStream,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm'});recordChunks=[];recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data);};recorder.onstop=()=>{let blob=new Blob(recordChunks,{type:'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dji-flight-'+Date.now()+'.webm';a.click();URL.revokeObjectURL(url);cameraStream?.getTracks().forEach(t=>t.stop());};recorder.start(500);state.recording=true;$('recState').textContent='REC ●';$('record').textContent='■ Стоп';beep(900,.12);}catch(e){toast('Запись недоступна: '+e.message);}}

function updateCamera(dt){let forward=new THREE.Vector3(-Math.sin(state.yaw),0,-Math.cos(state.yaw));let desired=new THREE.Vector3();if(state.view===0){desired.copy(state.pos).add(new THREE.Vector3(0,.35,0));camera.position.lerp(desired,1-Math.exp(-8*dt));let look=state.pos.clone().add(forward.multiplyScalar(25));look.y+=Math.sin(state.gimbal*Math.PI/180)*10;camera.lookAt(look);camera.rotation.z=settings.mode===2&&settings.drone==='avata'?state.roll*.55:0;}else if(state.view===1){desired.copy(state.pos).add(new THREE.Vector3(0,10,18).applyAxisAngle(new THREE.Vector3(0,1,0),state.yaw));camera.position.lerp(desired,1-Math.exp(-3*dt));camera.lookAt(state.pos);}else{camera.position.lerp(state.pos.clone().add(new THREE.Vector3(0,55,0)),.08);camera.lookAt(state.pos);camera.up.set(0,0,-1);}camera.zoom=settings.zoom;camera.updateProjectionMatrix();droneGroup.visible=state.view!==0;droneGroup.position.copy(state.pos);droneGroup.rotation.set(state.pitch*.22,state.yaw,-state.roll*.28);let rpm=state.flying?18+state.vel.length()*2:0;rotors.forEach((r,i)=>r.rotation.y+=dt*rpm*(i%2?1:-1));updateRotorAudio();}
function updateHUD(){let h=state.pos.y,spd=Math.hypot(state.vel.x,state.vel.z);$('battery').textContent=Math.round(state.battery)+'%';$('signal').textContent=Math.round(state.signal)+'%';$('alt').textContent=h.toFixed(1)+' m';$('speed').textContent=spd.toFixed(1)+' m/s';$('vspeed').textContent=state.vel.y.toFixed(1)+' m/s';$('dist').textContent=state.pos.distanceTo(state.home).toFixed(1)+' m';$('heading').textContent=String(Math.round((state.yaw*180/Math.PI+360)%360)).padStart(3,'0')+'°';$('modelLabel').textContent=selectedDrone.name+' · '+MODES[settings.mode];$('mode').textContent=MODES[settings.mode].toUpperCase();$('hudText').textContent=state.rth?'RTH · RETURNING':state.flying?'IN FLIGHT':'READY';$('holdB').style.setProperty('--p',(hold.b/.5*100)+'%');$('holdX').style.setProperty('--p',(hold.x/.5*100)+'%');$('horizon').style.setProperty('--roll',(state.roll*25)+'deg');drawMap();}

if(name==='settings'){html='<h1>Настройки</h1><div class="tabs"><span class="pill">Полет</span><span class="pill">Геймпад</span><span class="pill">Графика</span></div><div class="field"><label>Лимит высоты (1–250 м)</label><input id="maxAlt" type="number" min="1" max="250" value="'+settings.maxAlt+'"></div><div class="field"><label>Лимит дальности (м)</label><input id="maxRange" type="number" min="20" max="2000" value="'+settings.maxRange+'"></div><div class="field"><label>Датчики препятствий</label><input id="obstacles" type="checkbox" '+(settings.obstacles?'checked':'')+'></div><div class="field"><label>Мёртвая зона стиков</label><input id="deadStick" type="range" min="0" max=".3" step=".01" value="'+settings.deadStick+'"></div><div class="field"><label>Мёртвая зона триггеров</label><input id="deadTrigger" type="range" min="0" max=".15" step=".005" value="'+settings.deadTrigger+'"></div><div class="field"><label>Чувствительность</label><input id="sensitivity" type="range" min=".4" max="2" step=".05" value="'+settings.sensitivity+'"></div><div class="field"><label>Кривая отклика стиков</label><select id="curve"><option value="expo">Экспонента (мягкий центр)</option><option value="linear">Линейная</option></select></div><div class="field"><label>Сглаживание подвеса</label><input id="gimbalSmooth" type="range" min="1" max="18" value="'+settings.gimbalSmooth+'"></div><div class="field"><label>Сглаживание триггеров</label><input id="triggerSmooth" type="range" min="1" max="20" value="'+settings.triggerSmooth+'"></div><div class="field"><label>Скорость подвеса</label><input id="gimbalSpeed" type="range" min=".2" max="3" step=".1" value="'+settings.gimbalSpeed+'"></div><div class="field"><label>Озвучка</label><input id="voice" type="checkbox" '+(settings.voice?'checked':'')+'></div><div class="field"><label>Язык озвучки</label><select id="language"><option value="ru-RU">Русский</option><option value="en-US">English</option></select></div><div class="field"><label>Качество графики</label><select id="graphics"><option>low</option><option>medium</option><option>high</option></select></div><div class="field"><label>Тени</label><input id="shadows" type="checkbox" '+(settings.shadows?'checked':'')+'></div><div class="row"><button class="primary" id="saveSettings">Сохранить</button><button id="recal">Перекалибровать геймпад</button><button id="close">Закрыть</button></div>';}
if(name==='help'){html='<h1>Управление</h1><div class="grid"><div><b>Клавиатура</b><p class="help">W/S — тангаж вперёд/назад<br>A/D — крен влево/вправо<br>Q/E — рыскание<br>Space / Shift — высота<br>V — камера · M — миникарта<br>R — запись · Esc — меню</p></div><div><b>Геймпад · раскладка RC</b><p class="help">Левый стик — высота / yaw<br>Правый стик — pitch / roll<br>B удержать — взлёт, коротко — посадка<br>X удержать — RTH, повторно — отмена<br>RT/LT — аналоговый подвес<br>LB/RB — режим · Y — фото<br>A — меню/подтверждение, двойной A — стоп<br>Start — настройки · Select — карта<br>D-pad — подвес и зум</p></div></div><p class="help">Физика работает с фиксированным шагом 120 Гц. Gamepad API может сообщать разные индексы осей/триггеров в зависимости от браузера и раскладки устройства.</p><button id="close">Закрыть</button>';}
showModal(html);
$('close')?.addEventListener('click',()=>showModal(''));$('launch')?.addEventListener('click',()=>showModal(''));
document.querySelectorAll('[data-drone]').forEach(b=>b.onclick=()=>{settings.drone=b.dataset.drone;selectedDrone=DRONES[settings.drone];makeDrone();save();showPanel('flight');});
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{settings.scene=+b.dataset.scene;makeScene(settings.scene);save();showPanel('flight');});
document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{startQuick(b.dataset.quick);if(b.dataset.quick==='Hyperlapse')startRecording();showModal('');});
document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{state.track={mode:b.dataset.track,target:targets[0].group};speak(b.dataset.track);showModal('');});
$('photoNow')?.addEventListener('click',photoAction);$('recordNow')?.addEventListener('click',()=>state.recording?stopRecording():startRecording());
$('zoom')?.addEventListener('input',e=>{settings.zoom=+e.target.value;camera.zoom=settings.zoom;camera.updateProjectionMatrix();save();});
$('gimbal')?.addEventListener('input',e=>{gimbalTarget=+e.target.value;});
$('saveSettings')?.addEventListener('click',()=>{let val=id=>$(id);settings.maxAlt=clamp(+val('maxAlt').value,1,250);settings.maxRange=clamp(+val('maxRange').value,20,2000);settings.obstacles=val('obstacles').checked;settings.deadStick=+val('deadStick').value;settings.deadTrigger=+val('deadTrigger').value;settings.sensitivity=+val('sensitivity').value;settings.gimbalSmooth=+val('gimbalSmooth').value;settings.triggerSmooth=+val('triggerSmooth').value;settings.gimbalSpeed=+val('gimbalSpeed').value;settings.voice=val('voice').checked;settings.language=val('language').value;settings.graphics=val('graphics').value;settings.shadows=val('shadows').checked;let curve=val('curve').value;settings.curve=[curve,curve,curve,curve];save();renderer.shadowMap.enabled=settings.shadows;renderer.setPixelRatio(Math.min(devicePixelRatio,settings.graphics==='low'?1:settings.graphics==='medium'?1.3:1.8));renderer.setSize(innerWidth,innerHeight);toast('Настройки сохранены');showModal('');});
$('recal')?.addEventListener('click',beginCalibration);
}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>showPanel(b.dataset.open)));
$('takeoff').onclick=()=>state.flying?land():takeoff();$('rth').onclick=()=>state.rth?cancelRTH():startRTH();$('record').onclick=()=>state.recording?stopRecording():startRecording();$('photo').onclick=photoAction;$('view').onclick=cycleView;$('menu').onclick=()=>showPanel('flight');
$('view').textContent='Камера: '+['FPV','Cine','Top'][state.view];
/* === Клавиатурная поддержка удержаний и адаптивный рендер === */
function extraButtons(dt){if(keys.KeyB){hold.b+=dt;if(hold.b>.5&&!pressed.kb){pressed.kb=true;if(!state.flying)takeoff();}}else{if(hold.b>0&&hold.b<=.5&&state.flying)land();hold.b=0;pressed.kb=false;}if(keys.KeyX){hold.x+=dt;if(hold.x>.5&&!pressed.kx){pressed.kx=true;if(state.rth)cancelRTH();else startRTH();}}else{hold.x=0;pressed.kx=false;}if(keys.KeyN&&!pressed.n){setMode(settings.mode+1);pressed.n=true;}if(!keys.KeyN)pressed.n=false;}
const originalAnimate=animate;
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
/* Fixed-step loop wrapper: extra key holds, animated target traffic and pause state */
let loop=()=>{requestAnimationFrame(loop);let now=performance.now(),dt=Math.min(.05,(now-lastTime)/1000||.016);lastTime=now;if(!pad&&navigator.getGamepads){let detected=navigator.getGamepads().find(g=>g&&g.connected);if(detected){pad=detected;if(!calibration&&!calSession)beginCalibration();}}if(!state.paused){extraButtons(dt);targets.forEach((t,i)=>{t.group.position.x+=Math.sin(now*.00025+i)*.004;});let input=controls(dt);accumulator+=dt;while(accumulator>=physicsStep){physics(physicsStep,input);accumulator-=physicsStep;}updateCamera(dt);updateHUD();}renderer.render(scene,camera);};
// Единственный активный цикл рендеринга.
loop();
showPanel('flight');
</script>
</body></html>
